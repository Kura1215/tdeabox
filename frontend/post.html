<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TdeaVox - Detalle de Publicación</title>
    <meta name="description" content="Visualiza la publicación completa del foro TdeaVox y participa en el hilo de comentarios con tus compañeros de clase.">
    <!-- Enlace a la hoja de estilos retro universitaria -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Scripts de la Aplicación (con defer para que se ejecuten después de cargar el DOM) -->
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/post.js" defer></script>
    <style>
        /* Ajustes específicos de presentación para el detalle del post */
        .sidebar-widget {
            margin-bottom: 12px;
        }
        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--azul-claro);
            margin: 0 auto 8px auto;
            display: block;
            background-color: var(--gris-claro);
        }
        .user-info {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .user-info h4 {
            font-size: 13px;
            color: var(--azul);
            font-weight: bold;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .user-info p {
            color: var(--gris-medio);
            font-size: 11px;
            margin-bottom: 6px;
        }
        .post-completo {
            padding: 16px;
            margin-bottom: 16px;
        }
        .post-completo h2 {
            font-size: 18px;
            font-family: Arial, sans-serif;
            color: var(--azul);
            margin-bottom: 6px;
            font-weight: bold;
        }
        .comentario-item {
            padding: 12px;
            border-bottom: 1px solid var(--borde);
        }
        .comentario-item:last-child {
            border-bottom: none;
        }
        .comentario-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            vertical-align: middle;
            background-color: var(--gris-claro);
        }
        .comentario-meta {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: var(--gris-medio);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Sticky -->
    <nav>
        <a href="feed.html" class="nav-logo" id="nav-logo-link">Tdea<span>Vox</span></a>
        <div class="nav-links">
            <a href="crear-post.html" id="nav-link-crear">Crear Post</a>
            <a href="perfil.html" id="nav-link-perfil">Mi Perfil</a>
            <a href="#" id="nav-link-logout">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenedor Principal (Dos Columnas) -->
    <div class="container">
        
        <!-- Sidebar Izquierda -->
        <aside class="sidebar">
            
            <!-- Botón de retorno al feed -->
            <div class="sidebar-widget">
                <a href="feed.html" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none; margin-bottom: 12px;">
                    ◀ Volver al Feed
                </a>
            </div>

            <!-- Widget de Perfil del Usuario Logueado -->
            <div class="box sidebar-widget">
                <div class="box-header">MI PERFIL</div>
                <div class="box-body">
                    <div class="user-info">
                        <img id="sidebar-avatar" src="" alt="Foto de perfil" class="avatar-img">
                        <h4 id="sidebar-nombre">Cargando...</h4>
                        <p id="sidebar-username">@usuario</p>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Contenido Central (Detalle del Post e Hilo de Comentarios) -->
        <main class="main-content">
            
            <!-- Alerta local de notificaciones o errores -->
            <div id="post-alert" class="alerta"></div>

            <!-- Tarjeta de Detalle del Post Completo -->
            <div id="post-detail-container" class="box post-completo" style="background: var(--blanco); border: 1px solid var(--borde); border-radius: 4px;">
                <p style="text-align: center; color: var(--gris-medio); font-family: Arial, sans-serif;">
                    Cargando detalles de la publicación...
                </p>
            </div>

            <!-- Caja de Comentarios -->
            <div class="box">
                <div class="box-header">RESPUESTAS Y DEBATES</div>
                <div class="box-body" style="padding: 0;">
                    
                    <!-- Hilo de Comentarios Pintados -->
                    <div id="comments-list">
                        <p style="text-align: center; color: var(--gris-medio); font-family: Arial, sans-serif; padding: 20px;">
                            Cargando comentarios...
                        </p>
                    </div>
                    
                </div>
            </div>

            <!-- Caja de Nuevo Comentario -->
            <div class="box">
                <div class="box-header">AÑADIR RESPUESTA</div>
                <div class="box-body">
                    <form id="comment-form">
                        <div class="form-group">
                            <label for="comment-text">Escribe tu comentario</label>
                            <textarea id="comment-text" rows="3" placeholder="Aporta a la discusión o responde dudas..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="comment-image">Adjuntar Imagen (Opcional)</label>
                            <input type="file" id="comment-image" accept="image/*">
                        </div>
                        <button type="submit" id="btn-comment-submit" class="btn btn-primary" style="margin-top: 6px;">
                            Enviar Comentario
                        </button>
                    </form>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
