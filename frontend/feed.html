<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TdeaVox - Feed Principal</title>
    <meta name="description" content="Navega por las últimas publicaciones de la comunidad estudiantil del Tecnológico de Antioquia. Filtra por áreas académicas, eventos u objetos perdidos.">
    <!-- Enlace a la hoja de estilos retro universitaria -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Ajustes específicos de presentación para el feed */
        .sidebar-widget {
            margin-bottom: 12px;
        }
        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--azul-claro);
            margin: 0 auto 8px auto;
            display: block;
            background-color: var(--gris-claro);
        }
        .user-info {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .user-info h4 {
            font-size: 13px;
            color: var(--azul);
            font-weight: bold;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .user-info p {
            color: var(--gris-medio);
            font-size: 11px;
            margin-bottom: 6px;
        }
        .category-item {
            width: 100%;
            text-align: left;
            margin-bottom: 4px;
            border-radius: 4px;
            border: 1px solid var(--gris-claro);
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Sticky -->
    <nav>
        <a href="feed.html" class="nav-logo" id="nav-logo-link">Tdea<span>Vox</span></a>
        <div class="nav-links">
            <a href="crear-post.html" id="nav-link-crear">Crear Post</a>
            <a href="perfil.html" id="nav-link-perfil">Mi Perfil</a>
            <a href="#" id="nav-link-logout">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenedor Principal del Feed (Dos Columnas) -->
    <div class="container">
        
        <!-- Sidebar Izquierda -->
        <aside class="sidebar">
            
            <!-- Widget de Perfil del Usuario Logueado -->
            <div class="box sidebar-widget">
                <div class="box-header">MI PERFIL</div>
                <div class="box-body">
                    <div class="user-info">
                        <img id="sidebar-avatar" src="" alt="Foto de perfil" class="avatar-img">
                        <h4 id="sidebar-nombre">Cargando...</h4>
                        <p id="sidebar-username">@usuario</p>
                        <a href="perfil.html" class="btn btn-primary btn-sm" style="display: block; text-align: center; text-decoration: none;">Editar Perfil</a>
                    </div>
                </div>
            </div>

            <!-- Widget de Filtros por Categoría -->
            <div class="box sidebar-widget">
                <div class="box-header">CATEGORÍAS</div>
                <div class="box-body" style="padding: 8px;">
                    <div id="categorias-list" class="filtros" style="flex-direction: column; align-items: stretch; gap: 4px;">
                        <!-- Se poblará dinámicamente desde el backend -->
                        <button class="filtro-btn activo" data-id="">Todos</button>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Contenido Central (Posts) -->
        <main class="main-content">
            
            <!-- Barra de Búsqueda -->
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar publicaciones por título...">
                <button id="btn-buscar" class="btn btn-primary">Buscar</button>
            </div>

            <!-- Contenedor global de alertas informativas -->
            <div id="feed-alert" class="alerta"></div>

            <!-- Contenedor de Tarjetas de Publicación -->
            <div id="posts-container">
                <!-- Se poblará dinámicamente -->
                <p style="text-align: center; color: var(--gris-medio); font-family: Arial, sans-serif; padding: 20px;">
                    Cargando publicaciones...
                </p>
            </div>

        </main>
    </div>

    <!-- Scripts de la Aplicación -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
