<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TdeaVox - Mi Perfil</title>
    <meta name="description" content="Visualiza tu historial de publicaciones y actualiza tu información de perfil de estudiante en el foro del Tecnológico de Antioquia.">
    <!-- Enlace a la hoja de estilos retro universitaria -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Scripts de la Aplicación (con defer para que se ejecuten después de cargar el DOM) -->
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/perfil.js" defer></script>
    <style>
        /* Ajustes específicos de presentación para el perfil del usuario */
        .sidebar-widget {
            margin-bottom: 12px;
        }
        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--azul-claro);
            margin: 0 auto 8px auto;
            display: block;
            background-color: var(--gris-claro);
        }
        .user-info {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .user-info h4 {
            font-size: 13px;
            color: var(--azul);
            font-weight: bold;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .user-info p {
            color: var(--gris-medio);
            font-size: 11px;
            margin-bottom: 6px;
        }
        .post-historial-meta {
            color: var(--gris-medio);
            font-size: 11px;
            font-family: Arial, sans-serif;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Sticky -->
    <nav>
        <a href="feed.html" class="nav-logo" id="nav-logo-link">Tdea<span>Vox</span></a>
        <div class="nav-links">
            <a href="crear-post.html" id="nav-link-crear">Crear Post</a>
            <a href="perfil.html" id="nav-link-perfil" style="text-decoration: underline; color: white;">Mi Perfil</a>
            <a href="#" id="nav-link-logout">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenedor Principal (Dos Columnas) -->
    <div class="container">
        
        <!-- Sidebar Izquierda -->
        <aside class="sidebar">
            
            <!-- Botón de retorno al feed -->
            <div class="sidebar-widget">
                <a href="feed.html" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none; margin-bottom: 12px;">
                    ◀ Volver al Feed
                </a>
            </div>

            <!-- Widget de Perfil del Usuario Logueado (Sidebar) -->
            <div class="box sidebar-widget">
                <div class="box-header">MI PERFIL</div>
                <div class="box-body">
                    <div class="user-info">
                        <img id="sidebar-avatar" src="" alt="Foto de perfil" class="avatar-img">
                        <h4 id="sidebar-nombre">Cargando...</h4>
                        <p id="sidebar-username">@usuario</p>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Contenido Central (Detalle de Perfil y Listado de Posts del Estudiante) -->
        <main class="main-content">
            
            <!-- Alerta local de notificaciones o errores -->
            <div id="profile-alert" class="alerta"></div>

            <!-- Formulario de Edición de Perfil -->
            <div class="box">
                <div class="box-header">EDITAR DATOS PERSONALES</div>
                <div class="box-body">
                    <form id="profile-form">
                        
                        <div class="form-group">
                            <label for="profile-name">Nombre Completo</label>
                            <input type="text" id="profile-name" placeholder="Tu nombre real..." required>
                        </div>

                        <div class="form-group">
                            <label for="profile-username">Nombre de Usuario (Username)</label>
                            <input type="text" id="profile-username" disabled style="background-color: var(--gris-claro); cursor: not-allowed;">
                        </div>

                        <div class="form-group">
                            <label for="profile-email">Correo Institucional</label>
                            <input type="email" id="profile-email" disabled style="background-color: var(--gris-claro); cursor: not-allowed;">
                        </div>

                        <div class="form-group">
                            <label for="profile-avatar">Actualizar Foto de Perfil (Opcional)</label>
                            <input type="file" id="profile-avatar" accept="image/*">
                        </div>

                        <button type="submit" id="btn-save-profile" class="btn btn-primary" style="margin-top: 10px;">
                            Guardar Cambios
                        </button>

                    </form>
                </div>
            </div>

            <!-- Listado de Publicaciones Propias (Historial) -->
            <div class="box">
                <div class="box-header">MIS PUBLICACIONES PUBLICADAS</div>
                <div class="box-body" id="user-posts-container" style="padding: 10px 10px 2px 10px;">
                    <p style="text-align: center; color: var(--gris-medio); font-family: Arial, sans-serif; padding: 15px;">
                        Cargando tu historial de publicaciones...
                    </p>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
