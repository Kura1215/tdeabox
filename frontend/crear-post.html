<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TdeaVox - Crear Publicación</title>
    <meta name="description" content="Redacta una nueva publicación para la comunidad estudiantil del Tecnológico de Antioquia. Comparte dudas académicas, eventos u objetos perdidos.">
    <!-- Enlace a la hoja de estilos retro universitaria -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Scripts de la Aplicación (con defer para que se ejecuten después de cargar el DOM) -->
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/crear-post.js" defer></script>
    <style>
        /* Ajustes específicos de presentación para la creación de posts */
        .sidebar-widget {
            margin-bottom: 12px;
        }
        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--azul-claro);
            margin: 0 auto 8px auto;
            display: block;
            background-color: var(--gris-claro);
        }
        .user-info {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .user-info h4 {
            font-size: 13px;
            color: var(--azul);
            font-weight: bold;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .user-info p {
            color: var(--gris-medio);
            font-size: 11px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Sticky -->
    <nav>
        <a href="feed.html" class="nav-logo" id="nav-logo-link">Tdea<span>Vox</span></a>
        <div class="nav-links">
            <a href="crear-post.html" id="nav-link-crear" style="text-decoration: underline; color: white;">Crear Post</a>
            <a href="perfil.html" id="nav-link-perfil">Mi Perfil</a>
            <a href="#" id="nav-link-logout">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenedor Principal (Dos Columnas) -->
    <div class="container">
        
        <!-- Sidebar Izquierda -->
        <aside class="sidebar">
            
            <!-- Botón de retorno al feed -->
            <div class="sidebar-widget">
                <a href="feed.html" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none; margin-bottom: 12px;">
                    ◀ Volver al Feed
                </a>
            </div>

            <!-- Widget de Perfil del Usuario Logueado -->
            <div class="box sidebar-widget">
                <div class="box-header">MI PERFIL</div>
                <div class="box-body">
                    <div class="user-info">
                        <img id="sidebar-avatar" src="" alt="Foto de perfil" class="avatar-img">
                        <h4 id="sidebar-nombre">Cargando...</h4>
                        <p id="sidebar-username">@usuario</p>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Contenido Central (Formulario de Creación) -->
        <main class="main-content">
            
            <!-- Alerta local de notificaciones o errores -->
            <div id="create-post-alert" class="alerta"></div>

            <!-- Caja con el formulario de creación -->
            <div class="box">
                <div class="box-header">NUEVA PUBLICACIÓN</div>
                <div class="box-body">
                    <form id="create-post-form">
                        
                        <div class="form-group">
                            <label for="post-title">Título de la Publicación</label>
                            <input type="text" id="post-title" placeholder="Escribe un título descriptivo y claro..." required>
                        </div>

                        <div class="form-group">
                            <label for="post-category">Categoría</label>
                            <select id="post-category" required>
                                <option value="" disabled selected>Selecciona una categoría...</option>
                                <!-- Se poblará dinámicamente -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="post-content">Contenido / Descripción</label>
                            <textarea id="post-content" rows="6" placeholder="Describe a detalle tu duda académica, detalles de objetos perdidos o información de interés sobre el campus..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="post-image">Adjuntar Imagen (Opcional)</label>
                            <input type="file" id="post-image" accept="image/*">
                        </div>

                        <button type="submit" id="btn-submit-post" class="btn btn-primary" style="margin-top: 10px;">
                            Publicar en el Foro
                        </button>

                    </form>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
